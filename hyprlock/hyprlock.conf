$font = Press Start 2P

general {
    hide_cursor = true
}

# Background - Minecraft style with blur
background {
    blur_passes = 2
    blur_size = 10
}

# Input field - Minecraft style
input-field {
    size = 280, 55
    outline_thickness = 3
    dots_size = 0.35
    dots_spacing = 0.25
    
    # Minecraft colors (dark gray theme)
    inner_color = rgba(58, 58, 58, 0.92)
    outer_color = rgb(26, 26, 26)
    check_color = rgb(85, 193, 255)
    fail_color = rgb(255, 85, 85)
    font_color = rgba(255, 255, 255, 1.0)
    
    fade_on_empty = false
    fade_timeout = 1000
    
    font_family = $font
    placeholder_text = Enter password...
    
    # Position
    position = 0, 20
    halign = center
    valign = center
}

# User label
label {
    text = $USER
    font_family = $font
    font_size = 24
    color = rgba(255, 255, 255, 1.0)
    position = 0, -60
    halign = center
    valign = center
}
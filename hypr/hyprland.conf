# ~/.config/hypr/hyprland.conf
# Converted from your Sway config to Hyprland style
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = WLR_NO_HARDWARE_CURSORS,1
################
### VARIABLES ###
################

$mainMod = SUPER
$terminal = foot
$fileManager = nemo
$menu = eww open scourge && hyprctl dispatch submap scourge

################
### AUTOSTART ###
################

exec-once = /usr/bin/lxpolkit
exec-once = quickshell -p /home/proudrykar/.config/quickshell/minecraft-hud/shell.qml
exec-once = mkdir -p /home/proudrykar/.cache/awww
exec-once = awww-daemon
exec-once = sleep 1 && awww img /home/proudrykar/Pictures/Wallpapers/wallpaper.jpg
exec-once = sleep 2 && hyprctl keyword monitor HDMI-A-1,1280x1024@60,1920x0,1
################
### MONITORS ###
################

monitor=HDMI-A-1,1920x1080@100,0x0,1


#############################
### ENVIRONMENT VARIABLES ###
#############################s

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#################
### APPEARANCE ###
#################
misc {
    vrr = 0
}
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)
}
cursor {
    no_hardware_cursors = true
}
render {
    direct_scanout = false
}
decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 4
        passes = 2
    }

    shadow {
        enabled = true
    }
}

animations {
    enabled = yes
}

################
### INPUT ###
################

input {
    kb_layout = us,ru
    kb_options = grp:caps_toggle
    follow_mouse = 1
    sensitivity = 0
}

#####################
### KEYBINDINGS ###
#####################

# Terminal
bind = $mainMod, Q, exec, $terminal
bind = $mainMod SHIFT, Q, exec, ~/.config/hypr/scripts/nemo-terminal.sh

# Kill window
bind = $mainMod, C, killactive

# Launcher
bind = $mainMod, R, exec, $menu

# Lock screen
bind = $mainMod, L, exec, hyprlock

# File manager
bind = $mainMod, E, exec, $fileManager

# Reload config
bind = $mainMod SHIFT, C, exec, hyprctl reload

# Exit Hyprland
bind = $mainMod SHIFT, E, exit

# Fullscreen
bind = $mainMod, F, fullscreen

# Floating toggle
bind = $mainMod, v, togglefloating

# Split
bind = $mainMod, S, layoutmsg, togglesplit

# Focus movement Vim style
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Focus movement arrows
bind = $mainMod, left, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, right, movefocus, r

# Move windows Vim style
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Move windows arrows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

################
### WORKSPACES ###
################

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Workspace to monitors
workspace = 1, monitor:DP-2
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2

workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

###################
### SCREENSHOTS ###
###################

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/screenshot-$(date +'%Y%m%d_%H%M%S').png

###################
### MEDIA KEYS ###
###################

bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

###################
### MOUSE ###
###################

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

############################
### SCOURGE LAUNCHER ###
############################

# Режим управления лаунчером
submap = scourge

# Скриншоты
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/screenshot-$(date +'%Y%m%d_%H%M%S').png

# Закрытие по Escape
bind = , Escape, exec, eww close scourge && hyprctl dispatch submap reset

# Повторное нажатие Super + R закрывает лаунчер
bind = $mainMod, R, exec, eww close scourge && hyprctl dispatch submap reset

submap = reset